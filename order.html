<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า — Luna Care</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-wrapper">
      <a href="index.html" class="brand-logo">Luna Care</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="index.html#moods">คอลเลกชันกลิ่น</a></li>
          <li><a href="product.html">สินค้าทั้งหมด</a></li>
        </ul>
      </nav>
      <a href="product.html" class="cart-btn">เลือกสินค้าเพิ่ม</a>
    </div>
  </header>

  <!-- Order Form Section -->
  <section>
    <div class="container" style="max-width: 640px;">
      <div class="section-header" style="margin-bottom: 48px;">
        <span class="hero-subtitle">Order Placement</span>
        <h2>ข้อมูลการสั่งซื้อ</h2>
        <p>กรุณากรอกรายละเอียดสำหรับจัดส่งสินค้า ทีมงานจะติดต่อกลับเพื่อยืนยันออเดอร์โดยเร็วที่สุด</p>
      </div>

      <form id="orderForm" style="background-color: var(--bg-card); border: 1px solid var(--border-subtle); padding: 48px 40px;">
        <div class="form-group">
          <label for="customerName">ชื่อลูกค้า *</label>
          <input type="text" id="customerName" name="customerName" class="form-control" placeholder="ระบุชื่อ - นามสกุล" required>
        </div>

        <div class="form-group">
          <label for="contact">เบอร์โทร / Line ID *</label>
          <input type="text" id="contact" name="contact" class="form-control" placeholder="ระบุเบอร์โทรศัพท์ หรือ Line ID สำหรับติดต่อกลับ" required>
        </div>

        <div class="form-group">
          <label for="items">รายการสินค้า *</label>
          <input type="text" id="items" name="items" class="form-control" placeholder="ชื่อสินค้าที่ต้องการสั่งซื้อ" required>
        </div>

        <div class="form-group">
          <label for="total">จำนวนเงินรวม (บาท) *</label>
          <input type="number" id="total" name="total" class="form-control" placeholder="0" required>
        </div>

        <div class="form-group" style="margin-bottom: 36px;">
          <label for="note">หมายเหตุ / ที่อยู่จัดส่ง</label>
          <textarea id="note" name="note" rows="3" class="form-control" placeholder="ระบุที่อยู่จัดส่ง หรือข้อความเพิ่มเติม (ถ้ามี)"></textarea>
        </div>

        <button type="submit" class="btn" style="width: 100%;">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <a href="index.html" class="brand-logo">Luna Care</a>
      <p>เติมเต็มทุกมู้ดความหอมที่ใช่ในแบบคุณ เริ่มต้นตั้งแต่สัมผัสแรกกับ Luna Care</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
